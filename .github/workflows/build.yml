name: build

on:
  # 打 v* 标签时：构建并自动发布 Release（附带单文件 exe）
  push:
    tags: ["v*"]
  # 手动触发：构建并把产物上传为 Actions artifact
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # csproj 已配置：win-x64 + 自包含 + 单文件
      - name: Publish single-file exe
        run: dotnet publish -c Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivacyIsland-win-x64
          path: bin/Release/net8.0-windows/win-x64/publish/PrivacyIsland.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/net8.0-windows/win-x64/publish/PrivacyIsland.exe
          generate_release_notes: true
